name: Installer configuration acceptance
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/config-acceptance.yml
      - scripts/produce-config-acceptance.mjs
      - scripts/installers/**
      - tests/codex-config-installer.test.ts
      - docs/reviews/platformio-acceptance-requirements.json
      - package.json
      - package-lock.json
permissions:
  contents: read
jobs:
  installer:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Produce POL-05 evidence
        run: node scripts/produce-config-acceptance.mjs config-acceptance-packet
      - uses: actions/upload-artifact@v7
        with:
          name: platformio-parity-evidence
          path: config-acceptance-packet
          if-no-files-found: error
