name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the validated tarball to npm
        required: true
        default: false
        type: boolean

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  build_python:
    name: Build complete Python wheel set
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned wheel tooling and runtime dependencies
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 build==1.6.1 packaging==26.3 pyproject-hooks==1.3.3
          npm ci
          npm run plugin:build
          npm run plugin:validate
      - name: Assemble five platform wheels and two functional aliases
        shell: bash
        run: |
          mkdir -p python-release-artifacts
          for host in win32-x64 darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            python scripts/build-python-wheel.py "$host" "$RUNNER_TEMP/wheel-$host"
            cp "$RUNNER_TEMP/wheel-$host/dist/"*.whl python-release-artifacts/
          done
          python scripts/build-python-aliases.py "$RUNNER_TEMP/python-aliases"
          cp "$RUNNER_TEMP/python-aliases/dist/"*.whl python-release-artifacts/
          python scripts/validate-python-release.py python-release-artifacts
      - name: Retain validated Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: platformio-python-release
          path: python-release-artifacts
          if-no-files-found: error

  accept_python:
    name: Install Python wheels (${{ matrix.host }})
    needs: build_python
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: win32-x64
            runner: windows-2022
          - host: darwin-arm64
            runner: macos-14
          - host: darwin-x64
            runner: macos-15-intel
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Download this run's complete wheel set
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name platformio-python-release --dir python-release-artifacts
      - name: Verify native installation and functional aliases
        run: python scripts/accept-python-host.py python-release-artifacts "${{ matrix.host }}" "python-host-evidence/${{ matrix.host }}.json"
      - name: Retain artifact-bound native acceptance
        uses: actions/upload-artifact@v7
        with:
          name: python-host-${{ matrix.host }}
          path: python-host-evidence
          if-no-files-found: error

  build_release:
    name: Build release artifacts
    needs: [build_python, accept_python]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm
        run: |
          expected_ref="refs/tags/v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Release must run from $expected_ref; received $GITHUB_REF" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci && npm --prefix web ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run release gates
        run: |
          npx tsc --noEmit
          npm run lint
          npm audit --audit-level=low
          npm --prefix web audit --audit-level=low
          npm run test:ci:unit
          npm run test:namespaces
          npm run registry:validate
          npm --prefix web run test -- --run
          npm run test:e2e:ci
          npm --prefix web run test:e2e:codex
          npm run plugin:sync:check
          npm run plugin:build
          npm run plugin:validate
          npm run test:python-runtime
          npm run plugin:test
          npm run smoke-test
          npm run package:validate
          git diff --exit-code -- plugins/platformio-mcp

      - name: Record current public namespace observations
        run: |
          mkdir -p .namespace-audit
          cp docs/reviews/platformio-namespace-observations.json .namespace-audit/report.json
          node scripts/audit-namespaces.mjs .namespace-audit/report.json

      - name: Build npm tarball
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-artifacts
          npm pack
          npm pack ./packages/pio-mcp
          npm pack ./packages/pio-agent
          mv "platformio-mcp-${version}.tgz" release-artifacts/
          mv "pio-mcp-${version}.tgz" release-artifacts/
          mv "pio-agent-${version}.tgz" release-artifacts/
          cp plugins/platformio-mcp/runtime/inventory.json release-artifacts/plugin-runtime-inventory.json
          cp server.json release-artifacts/server.json
          cp .namespace-audit/report.json release-artifacts/namespace-observations.json

      - name: Collect validated Python wheels from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name platformio-python-release --dir release-artifacts
          gh run download "$GITHUB_RUN_ID" --pattern 'python-host-*' --dir release-artifacts/python-host-evidence

      - name: Verify npm release identities before publication
        if: inputs.publish_npm
        run: node scripts/npm-release-identity.mjs

      - name: Upload immutable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: platformio-mcp-release
          path: release-artifacts
          if-no-files-found: error

      - name: Publish npm package when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
        run: node scripts/npm-release-identity.mjs --publish

      - name: Attach artifacts to GitHub tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-artifacts/*
          else
            gh release create "${{ github.ref_name }}" release-artifacts/* --generate-notes --verify-tag
          fi
