name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the validated tarball to npm
        required: true
        default: false
        type: boolean

      publish_pypi:
        description: Publish validated Python wheels using configured PyPI trusted publishers
        required: true
        default: false
        type: boolean

      publish_mcp_registry:
        description: Publish the exact npm-backed descriptor to the official MCP Registry
        required: true
        default: false
        type: boolean

      publish_ghcr:
        description: Publish validated native images under all seven verified GHCR aliases
        required: true
        default: false
        type: boolean

      acceptance_run_id:
        description: Completed same-commit acceptance run containing platformio-parity-acceptance evidence (required for publication)
        required: false
        type: string

permissions:
  actions: read
  contents: write
  id-token: write

jobs:
  build_python:
    name: Build complete Python wheel set
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Install pinned wheel tooling and runtime dependencies
        run: |
          python -m pip install setuptools==84.0.0 wheel==0.48.0 build==1.6.1 packaging==26.3 pyproject-hooks==1.3.3
          npm ci
          npm run plugin:build
          npm run plugin:validate
      - name: Assemble five platform wheels and inventory-defined functional aliases
        shell: bash
        run: |
          mkdir -p python-release-artifacts
          for host in win32-x64 darwin-arm64 darwin-x64 linux-arm64 linux-x64; do
            python scripts/build-python-wheel.py "$host" "$RUNNER_TEMP/wheel-$host"
            cp "$RUNNER_TEMP/wheel-$host/dist/"*.whl python-release-artifacts/
          done
          python scripts/build-python-aliases.py "$RUNNER_TEMP/python-aliases"
          cp "$RUNNER_TEMP/python-aliases/dist/"*.whl python-release-artifacts/
          python scripts/validate-python-release.py python-release-artifacts
      - name: Retain validated Python artifacts
        uses: actions/upload-artifact@v7
        with:
          name: platformio-python-release
          path: python-release-artifacts
          if-no-files-found: error

  accept_python:
    name: Install Python wheels (${{ matrix.host }})
    needs: build_python
    strategy:
      fail-fast: false
      matrix:
        include:
          - host: win32-x64
            runner: windows-2022
          - host: darwin-arm64
            runner: macos-14
          - host: darwin-x64
            runner: macos-15-intel
          - host: linux-arm64
            runner: ubuntu-24.04-arm
          - host: linux-x64
            runner: ubuntu-24.04
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Download this run's complete wheel set
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "${{ github.run_id }}" --name platformio-python-release --dir python-release-artifacts
      - name: Verify native installation and functional aliases
        run: python scripts/accept-python-host.py python-release-artifacts "${{ matrix.host }}" "python-host-evidence/${{ matrix.host }}.json"
      - name: Retain artifact-bound native acceptance
        uses: actions/upload-artifact@v7
        with:
          name: python-host-${{ matrix.host }}
          path: python-host-evidence
          if-no-files-found: error

  build_container:
    name: Build native container (${{ matrix.arch }})
    needs: [build_python, accept_python]
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Download exact validated wheels
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name platformio-python-release --dir python-release-artifacts
      - name: Build native image from minimal validated context
        run: |
          python scripts/prepare-container-context.py python-release-artifacts "$RUNNER_TEMP/container-context"
          version="$(python -c 'import json; print(json.load(open("package.json"))["version"])')"
          docker build --build-arg VERSION="$version" --build-arg SOURCE_COMMIT="$GITHUB_SHA" --tag "pio-agent:$GITHUB_SHA" "$RUNNER_TEMP/container-context"
          actual="$(docker run --rm --network none "pio-agent:$GITHUB_SHA" --version)"
          test "$actual" = "$version"
          mkdir -p container-artifacts
          docker image inspect "pio-agent:$GITHUB_SHA" > "container-artifacts/image-${{ matrix.arch }}.json"
          docker save "pio-agent:$GITHUB_SHA" --output "container-artifacts/pio-agent-${{ matrix.arch }}.tar"
          sha256sum "container-artifacts/pio-agent-${{ matrix.arch }}.tar" > "container-artifacts/pio-agent-${{ matrix.arch }}.sha256"
          cp "$RUNNER_TEMP/container-context/identity.json" "container-artifacts/source-${{ matrix.arch }}.json"
      - name: Retain native image and source identities
        uses: actions/upload-artifact@v7
        with:
          name: platformio-container-${{ matrix.arch }}
          path: container-artifacts
          if-no-files-found: error
          compression-level: 0

  build_release:
    name: Build release artifacts
    needs: [build_python, accept_python, build_container]
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm || inputs.publish_pypi || inputs.publish_mcp_registry || inputs.publish_ghcr
        run: |
          expected_ref="refs/tags/v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Release must run from $expected_ref; received $GITHUB_REF" >&2
            exit 1
          fi

      - name: Require complete final-revision acceptance before publication
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm || inputs.publish_pypi || inputs.publish_mcp_registry || inputs.publish_ghcr
        env:
          GH_TOKEN: ${{ github.token }}
          ACCEPTANCE_RUN: ${{ inputs.acceptance_run_id }}
        run: |
          [[ "$ACCEPTANCE_RUN" =~ ^[0-9]+$ ]] || { echo 'A completed same-commit acceptance run is required for publication.' >&2; exit 1; }
          gh run view "$ACCEPTANCE_RUN" --json conclusion,headSha > "$RUNNER_TEMP/acceptance-run.json"
          python3 -c 'import json,os; from pathlib import Path; r=json.loads((Path(os.environ["RUNNER_TEMP"])/"acceptance-run.json").read_text()); assert r["conclusion"] == "success" and r["headSha"] == os.environ["GITHUB_SHA"], "Acceptance run must pass on the exact release commit"'
          gh run download "$ACCEPTANCE_RUN" --name platformio-parity-acceptance --dir .release-acceptance
          node scripts/validate-parity-acceptance.mjs .release-acceptance/manifest.json

      - name: Install dependencies
        run: npm ci && npm --prefix web ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run release gates
        run: |
          npx tsc --noEmit
          npm run lint
          npm audit --audit-level=low
          npm --prefix web audit --audit-level=low
          npm run test:ci:unit
          npm run test:namespaces
          npm run aliases:check
          python3 tests/test-container-release.py
          python3 tests/test-container-publication.py
          npm run registry:validate
          npm --prefix web run test -- --run
          npm run test:e2e:ci
          npm --prefix web run test:e2e:codex
          npm run plugin:sync:check
          npm run plugin:build
          npm run plugin:validate
          npm run test:python-runtime
          npm run plugin:test
          npm run smoke-test
          npm run package:validate
          git diff --exit-code -- plugins/platformio-mcp

      - name: Record current public namespace observations
        run: |
          mkdir -p .namespace-audit
          cp docs/reviews/platformio-namespace-observations.json .namespace-audit/report.json
          node scripts/audit-namespaces.mjs .namespace-audit/report.json

      - name: Build npm tarball
        run: |
          npm run package:release
          cp plugins/platformio-mcp/runtime/inventory.json release-artifacts/plugin-runtime-inventory.json
          cp server.json release-artifacts/server.json
          cp .namespace-audit/report.json release-artifacts/namespace-observations.json

      - name: Package functional npm namespace candidates
        run: npm run package:aliases

      - name: Collect validated Python wheels from this run
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run download "$GITHUB_RUN_ID" --name platformio-python-release --dir release-artifacts
          gh run download "$GITHUB_RUN_ID" --pattern 'python-host-*' --dir release-artifacts/python-host-evidence
          tar -czf release-artifacts/python-host-evidence.tar.gz -C release-artifacts python-host-evidence

      - name: Bind both native container archives to this release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p container-release-artifacts
          gh run download "$GITHUB_RUN_ID" --name platformio-container-amd64 --dir container-release-artifacts
          gh run download "$GITHUB_RUN_ID" --name platformio-container-arm64 --dir container-release-artifacts
          python3 scripts/validate-container-release.py container-release-artifacts --load --output release-artifacts/container-release-identity.json

      - name: Verify npm release identities before publication
        if: inputs.publish_npm
        run: node scripts/npm-release-identity.mjs

      - name: Upload immutable artifacts
        uses: actions/upload-artifact@v7
        with:
          name: platformio-mcp-release
          path: release-artifacts
          if-no-files-found: error

      - name: Publish npm package when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
        run: node scripts/npm-release-identity.mjs --publish

      - name: Attach artifacts to GitHub tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mapfile -d '' artifacts < <(find release-artifacts -maxdepth 1 -type f -print0)
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" "${artifacts[@]}"
          else
            gh release create "${{ github.ref_name }}" "${artifacts[@]}" --generate-notes --verify-tag
          fi

  publish_python:
    name: Publish verified Python distributions
    needs: build_release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_pypi
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: '3.11'
      - name: Require recorded publisher configuration
        env:
          PUBLISHERS_VERIFIED: ${{ vars.PYPI_PUBLISHERS_VERIFIED }}
        run: |
          test "$PUBLISHERS_VERIFIED" = "$(python scripts/python-release-packages.py)" || { echo 'Configure and verify all selected PyPI trusted publishers and the protected pypi environment first.' >&2; exit 1; }
      - name: Download immutable validated wheel set
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name platformio-python-release --dir python-release-artifacts
      - name: Check registry identities and stage absent artifacts
        id: preflight
        run: python scripts/pypi-release-identity.py python-release-artifacts --stage pypi-staging
      - name: Publish canonical wheels with attestations
        if: steps.preflight.outputs.canonical == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: pypi-staging/canonical/
          attestations: true
      - name: Verify canonical files before publishing aliases
        run: python scripts/pypi-release-identity.py python-release-artifacts --verify pio-agent-platformio
      - name: Publish functional aliases with attestations
        if: steps.preflight.outputs.aliases == 'true'
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33
        with:
          packages-dir: pypi-staging/aliases/
          attestations: true
      - name: Verify all published file identities
        run: python scripts/pypi-release-identity.py python-release-artifacts --verify all
      - name: Retain publication preflight
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: pypi-publication-preflight
          path: pypi-staging/preflight.json
          if-no-files-found: warn

  publish_mcp_registry:
    name: Publish verified MCP Registry descriptor
    needs: build_release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_mcp_registry
    runs-on: ubuntu-latest
    environment: mcp-registry
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          package-manager-cache: false
      - name: Require configured registry publication protection
        env:
          REGISTRY_VERIFIED: ${{ vars.MCP_REGISTRY_PUBLISHER_VERIFIED }}
        run: test "$REGISTRY_VERIFIED" = 'io.github.jl-codes/platformio-mcp'
      - name: Install locked validation dependencies
        run: npm ci --ignore-scripts
      - name: Download this run's immutable release artifacts
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh run download "$GITHUB_RUN_ID" --name platformio-mcp-release --dir release-artifacts
      - name: Verify npm artifact identity and check for conflicting registry version
        id: preflight
        run: node scripts/mcp-release-identity.mjs
      - name: Install checksum-pinned official publisher
        if: steps.preflight.outputs.publish == 'true'
        run: |
          curl --fail --location --max-time 60 --max-filesize 67108864 --output "$RUNNER_TEMP/mcp-publisher.tar.gz" https://github.com/modelcontextprotocol/registry/releases/download/v1.8.1/mcp-publisher_linux_amd64.tar.gz
          echo "a06c9096dcb9727c13555b6be26c7effa707b01f06a4c561ba7a3635443cf2cc  $RUNNER_TEMP/mcp-publisher.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/mcp-publisher.tar.gz" -C "$RUNNER_TEMP" mcp-publisher
      - name: Authenticate through GitHub OIDC and publish
        if: steps.preflight.outputs.publish == 'true'
        run: |
          "$RUNNER_TEMP/mcp-publisher" login github-oidc
          "$RUNNER_TEMP/mcp-publisher" publish release-artifacts/server.json
      - name: Verify published descriptor
        run: node scripts/mcp-release-identity.mjs --verify
      - name: Retain descriptor publication evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mcp-registry-publication
          path: release-artifacts/mcp-publication-*.json
          if-no-files-found: warn

  publish_container:
    name: Publish all seven verified container aliases
    needs: build_release
    if: github.event_name == 'workflow_dispatch' && inputs.publish_ghcr
    runs-on: ubuntu-24.04
    environment: ghcr
    concurrency:
      group: platformio-ghcr-publication
      cancel-in-progress: false
    permissions:
      contents: read
      actions: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - name: Download this run's validated native archives
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p container-release-artifacts
          gh run download "$GITHUB_RUN_ID" --name platformio-container-amd64 --dir container-release-artifacts
          gh run download "$GITHUB_RUN_ID" --name platformio-container-arm64 --dir container-release-artifacts
      - name: Authenticate and publish identical version indexes
        env:
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ github.token }}
          GHCR_PUBLISHERS_VERIFIED: ${{ vars.GHCR_PUBLISHERS_VERIFIED }}
          DOCKER_CONFIG: ${{ runner.temp }}/platformio-docker-auth
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GHCR_ACTOR" --password-stdin
          trap 'docker logout ghcr.io >/dev/null 2>&1' EXIT
          python3 scripts/publish-container-release.py container-release-artifacts --output container-publication/evidence.json
      - name: Retain container publication accounting
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: ghcr-publication
          path: container-publication/evidence.json
          if-no-files-found: warn
