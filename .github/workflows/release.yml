name: Release

on:
  workflow_dispatch:
    inputs:
      publish_npm:
        description: Publish the validated tarball to npm
        required: true
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

jobs:
  build_release:
    name: Build release artifacts
    runs-on: ubuntu-latest

    steps:
      - name: Checkout exact release commit
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
          package-manager-cache: false

      - name: Verify release tag matches package version
        if: startsWith(github.ref, 'refs/tags/v') || inputs.publish_npm
        run: |
          expected_ref="refs/tags/v$(node -p "require('./package.json').version")"
          if [ "$GITHUB_REF" != "$expected_ref" ]; then
            echo "Release must run from $expected_ref; received $GITHUB_REF" >&2
            exit 1
          fi

      - name: Install dependencies
        run: npm ci && npm --prefix web ci

      - name: Install Chromium
        working-directory: web
        run: npx playwright install --with-deps chromium

      - name: Run release gates
        run: |
          npx tsc --noEmit
          npm run lint
          npm audit --audit-level=low
          npm --prefix web audit --audit-level=low
          npm run test:ci:unit
          npm --prefix web run test -- --run
          npm run test:e2e:ci
          npm --prefix web run test:e2e:codex
          npm run plugin:sync:check
          npm run plugin:build
          npm run plugin:validate
          npm run plugin:test
          npm run smoke-test
          npm run package:validate
          git diff --exit-code -- plugins/platformio-mcp

      - name: Build npm tarball
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p release-artifacts
          npm pack
          npm pack ./packages/pio-mcp
          mv "platformio-mcp-${version}.tgz" release-artifacts/
          mv "pio-mcp-${version}.tgz" release-artifacts/
          cp plugins/platformio-mcp/runtime/inventory.json release-artifacts/plugin-runtime-inventory.json

      - name: Upload immutable artifacts
        uses: actions/upload-artifact@v4
        with:
          name: platformio-mcp-release
          path: release-artifacts
          if-no-files-found: error

      - name: Publish npm package when explicitly requested
        if: github.event_name == 'workflow_dispatch' && inputs.publish_npm
        run: |
          version="$(node -p "require('./package.json').version")"
          for package_name in platformio-mcp pio-mcp; do
            if npm view "${package_name}@${version}" version >/dev/null 2>&1; then
              echo "${package_name}@${version} is already published; skipping"
            else
              npm publish "release-artifacts/${package_name}-${version}.tgz" --access public
            fi
          done

      - name: Attach artifacts to GitHub tag
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${{ github.ref_name }}" >/dev/null 2>&1; then
            gh release upload "${{ github.ref_name }}" release-artifacts/* --clobber
          else
            gh release create "${{ github.ref_name }}" release-artifacts/* --generate-notes --verify-tag
          fi
