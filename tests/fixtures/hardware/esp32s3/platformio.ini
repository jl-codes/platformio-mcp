[env:hil-esp32s3]
platform = espressif32@7.0.1
board = esp32-s3-devkitc-1
framework = arduino
build_type = debug
build_flags = -g3 -Og
monitor_speed = 115200


; Same fixture over the connected native USB Serial/JTAG controller.
; Separate environment preserves the prior UART firmware and its evidence.
[env:hil-esp32s3-native]
extends = env:hil-esp32s3
build_flags = ${env:hil-esp32s3.build_flags} -DARDUINO_USB_CDC_ON_BOOT=1 -DPIO_HIL_HEARTBEAT_UNTIL_MS=15000
board_build.partitions = partitions-hil.csv
